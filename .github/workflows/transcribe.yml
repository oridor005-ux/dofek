name: תמלול סרטונים

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # כל רבע שעה
  workflow_dispatch:
    inputs:
      test_urls:
        description: 'בדיקה: קישורים (אפשר להוסיף @@דקה, למשל ...@@12:30)'
        required: false
      test_channels:
        description: 'בדיקה: ערוצי טיקטוק (מופרדים ברווח)'
        required: false

permissions:
  contents: write

concurrency:
  group: dofek-transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: יש סרטונים לתמלל?
        id: vids
        run: |
          n=$(node -e "const r=JSON.parse(require('fs').readFileSync('data/requests.json','utf8')).items||[];const re=/(youtube\.com|youtu\.be|tiktok\.com|instagram\.com|facebook\.com|fb\.watch|x\.com|twitter\.com|t\.me|vimeo\.com|kan\.org\.il|mako\.co\.il|13tv\.co\.il|now14\.co\.il|i24news|reshet)/i;console.log(r.filter(x=>(x.status||'pending')==='pending'&&x.link&&re.test(x.link)&&x.transcriptStatus!=='ok'&&(x.transcriptTries||0)<3).length)" 2>/dev/null || echo 0)
          c=$(node -e "console.log((JSON.parse(require('fs').readFileSync('config.json','utf8')).tiktokChannels||[]).length)")
          n=$((n + c))
          if [ -n "${{ inputs.test_urls }}${{ inputs.test_channels }}" ]; then n=1; fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.vids.outputs.count != '0'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: מודל התמלול (מטמון)
        if: steps.vids.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ivrit-turbo-v1
      - name: תמלול
        if: steps.vids.outputs.count != '0'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -r scripts/requirements.txt
          mkdir -p data/transcripts
          if [ -n "${{ inputs.test_channels }}" ]; then
            TEST_CHANNELS="${{ inputs.test_channels }}" PER_CHANNEL=2 MAX_NEW=3 python scripts/tiktok_watch.py --test 2>&1 | tee data/transcripts/_test.log
            git checkout -- data/videos.json 2>/dev/null || rm -f data/videos.json
          elif [ -n "${{ inputs.test_urls }}" ]; then
            python scripts/transcribe.py --test ${{ inputs.test_urls }} 2>&1 | tee data/transcripts/_test.log
          else
            python scripts/transcribe.py
            python scripts/tiktok_watch.py
          fi
      - name: שמירה
        if: steps.vids.outputs.count != '0'
        run: |
          git config user.name "dofek-bot"
          git config user.email "dofek-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "תמלול סרטונים"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
