name: עדכון דופק

on:
  schedule:
    - cron: '*/30 * * * *'   # כל חצי שעה
  push:
    paths:
      - 'data/insights.json'  # כש-Claude מוסיף ניתוח חדש — לשלוח פוש מיד
  workflow_dispatch:          # הרצה ידנית מתוך GitHub
    inputs:
      test_urls:
        description: 'בדיקת תמלול: קישורים לסרטונים (מופרדים ברווח)'
        required: false

permissions:
  contents: write

concurrency:
  group: dofek-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: איסוף כותרות ושליחת פושים
        if: ${{ !inputs.test_urls }}
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/fetch.mjs
      - name: יש סרטונים לתמלל?
        id: vids
        run: |
          n=$(node -e "const r=JSON.parse(require('fs').readFileSync('data/requests.json','utf8')).items||[];const re=/(youtube\.com|youtu\.be|tiktok\.com|instagram\.com|facebook\.com|fb\.watch|x\.com|twitter\.com|t\.me|vimeo\.com|kan\.org\.il|mako\.co\.il|13tv\.co\.il|now14\.co\.il|i24news|reshet)/i;console.log(r.filter(x=>(x.status||'pending')==='pending'&&x.link&&re.test(x.link)&&x.transcriptStatus!=='ok'&&(x.transcriptTries||0)<3).length)" 2>/dev/null || echo 0)
          if [ -n "${{ inputs.test_urls }}" ]; then n=1; fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.vids.outputs.count != '0'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: מודל התמלול (מטמון)
        if: steps.vids.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: תמלול סרטונים
        if: steps.vids.outputs.count != '0'
        run: |
          pip install -q -r scripts/requirements.txt
          if [ -n "${{ inputs.test_urls }}" ]; then
            python scripts/transcribe.py --test ${{ inputs.test_urls }}
          else
            python scripts/transcribe.py
          fi
      - name: שמירה
        if: ${{ !inputs.test_urls }}
        run: |
          git config user.name "dofek-bot"
          git config user.email "dofek-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "עדכון פיד $(date -u +%H:%M)"
          git pull --rebase -X theirs || true
          git push
