name: עדכון דופק

on:
  schedule:
    - cron: '*/15 * * * *'   # כל רבע שעה; בתוך כל ריצה בודקים כל 2 דקות
  push:
    paths:
      - 'data/insights.json'  # כש-Claude מוסיף ניתוח חדש — לשלוח פוש מיד
  workflow_dispatch:          # הרצה ידנית מתוך GitHub
    inputs:
      test_push:
        description: 'שליחת פוש בדיקה בלבד'
        required: false
      loop:
        description: 'ריצה רציפה (מופעל אוטומטית)'
        required: false
      test_alert:
        description: 'שליחת התראת מנהל לבדיקה'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: dofek-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: איסוף כותרות ושליחת פושים
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          npm i --no-save --no-audit --no-fund --silent web-push@3.6.7 || echo "web-push install failed"

          # ריצה מלאה (כולל חיפושים), ואז בדיקה מהירה של האתרים כל 2 דקות — כמעט בזמן אמת
          git config user.name "dofek-bot"
          git config user.email "dofek-bot@users.noreply.github.com"
          save() {  # שומר מיד אחרי שנשלח פוש, כדי שהידיעה תופיע באפליקציה כשלוחצים עליו
            git add data/ && git diff --cached --quiet && return 0
            git commit -qm "עדכון חי $(date -u +%H:%M)" && (git pull -q --rebase -X theirs && git push -q) || true
          }
          rm -f /tmp/dofek_pushed
          node scripts/fetch.mjs
          if [ "${{ github.event_name }}" = "schedule" ] || [ -n "${{ inputs.loop }}" ]; then
            for i in 1 2 3 4 5 6; do
              if [ -f /tmp/dofek_pushed ]; then save; rm -f /tmp/dofek_pushed; fi
              sleep 110; LIGHT=1 node scripts/fetch.mjs || true
            done
          fi
      - name: בדיקת בריאות והתראה למנהל
        if: always()
        env:
          ADMIN_TOPIC: ${{ secrets.ADMIN_TOPIC }}
        run: |
          if [ -n "${{ inputs.test_alert }}" ]; then node scripts/health.mjs --test; else node scripts/health.mjs --from=update || true; fi
      - name: שמירה
        run: |
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "עדכון פיד $(date -u +%H:%M)"
          git pull --rebase -X theirs || true
          git push
      - name: החייאת מעקב הטיקטוק אם נעצר
        if: always()
        run: |
          age=$(node -e "const v=JSON.parse(require('fs').readFileSync('data/videos.json','utf8'));console.log(Math.round((Date.now()-new Date(v.health?.at||0))/60000))")
          echo "tiktok last run: $age min ago"
          if [ "$age" -gt 40 ]; then
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/transcribe.yml/dispatches \
              -d '{"ref":"main","inputs":{"loop":"1"}}' -o /dev/null -w "revive: %{http_code}\n"
          fi
      - name: הפעלת הסבב הבא (שרשרת רציפה — לא תלויה בתזמון של GitHub)
        if: ${{ always() && !inputs.test_push && !inputs.test_alert }}
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches \
            -d '{"ref":"main","inputs":{"loop":"1"}}' -o /dev/null -w "next run: %{http_code}\n"
