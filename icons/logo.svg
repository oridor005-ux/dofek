<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263D"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B544"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- faint baseline grid -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="6">
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
  </g>
  <!-- pulse line that ends rising -->
  <polyline points="88,300 168,300 200,232 240,372 290,150 326,300 360,300 388,236 424,236"
    fill="none" stroke="url(#ln)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="424" cy="236" r="26" fill="#FF7A45"/>
  <circle cx="424" cy="236" r="44" fill="none" stroke="#FF7A45" stroke-opacity=".35" stroke-width="10"/>
</svg>
